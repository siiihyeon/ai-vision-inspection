name: Static checks

on:
  pull_request:
  push:
    branches: [main, "feature/**", "fix/**"]

jobs:
  skeleton-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install static analysis
        run: python3 -m pip install pyflakes==3.4.0
      - name: Check Python undefined names and import usage
        run: pyflakes ros2_ws/src ros2_ws/tools
      - name: Verify package structure and interface contract
        run: python3 ros2_ws/tools/verify_skeleton.py
      - name: Test pure domain contracts
        run: python3 ros2_ws/tools/test_domain_contracts.py
      - name: Test VisionNode domain and runtime contracts
        run: python3 ros2_ws/tools/test_vision_node.py
