/**:
  ros__parameters:
    profile: hardware
    comm.master_heartbeat_timeout_ms: 5000

/inspection/master_node:
  ros__parameters:
    comm.master_heartbeat_period_ms: 500
    comm.node_heartbeat_timeout_ms: 5000
    system.expected_interface_version: "2.1.0"
    system.config_version: "dev-001"
    system.init_timeout_ms: 10000
    retry.init_interval_ms: 1000
    retry.warning_after_attempts: 3
    master.fifo.soft_limit: 18
    master.fifo.hard_capacity: 20
    master.station_b.skip_after_station_a_ng: false
    master.sensor_ids.sensor_1: "SENSOR_1"
    master.sensor_ids.sensor_2: "SENSOR_2"
    master.sensor_ids.sensor_3: "SENSOR_3"
    master.sensor.accepted_edge: 1
    master.hardware_mapping_confirmed: True
    master.camera_ids.station_a: ["DA9880512", "DA9880516", "DA7552836"]
    master.camera_ids.station_b: ["DA7838410"]
    master.action.position_timeout_ms: 10000
    master.action.capture_timeout_ms: 30000
    master.action.actuation_timeout_ms: 10000
    master.action.conveyor_resume_timeout_ms: 10000
    master.action.conveyor_run_timeout_ms: 10000
    master.pause_stop_timeout_ms: 10000
    master.shutdown_stop_timeout_ms: 10000
    master.log_spool_path: "/var/lib/inspection/spool/master.sqlite3"
    master.log_flush_period_ms: 1000
    master.log_spool_warning_bytes: 0
    master.log_spool_hard_bytes: 0
    master.completed_context_retention_ms: 600000

/inspection/control_node:
  ros__parameters:
    comm.node_heartbeat_period_ms: 500
    control.mega.port: "/dev/ttyACM0"
    control.mega.baud_rate: 115200
    control.tb6600.upper_config: "fw_v2;conveyor=1;step=10;dir=9;enable=8;enable_active=LOW;speed=3000;max_speed=10000;accel=10000;offset_steps=15100"
    control.tb6600.lower_config: "fw_v2;conveyor=2;step=5;dir=4;enable=3;enable_active=LOW;speed=-3000;max_speed=10000;accel=10000;offset_steps=7700"
    control.sensor_config: "fw_v2;sensor1=HC-SR04:trig25:echo24;sensor2=HC-SR04:trig31:echo30;sensor3=HC-SR04:trig36:echo37;detect_cm=10;release_cm=12;edge=RISING"
    control.actuator_config: "fw_v2;type=MG996R;pin=44;home_deg=0;reject_deg=70;move_ms=500;hold_ms=3000;NG=1;PASS=2"
    control.actuator.timeout_ms: 10000
    control.station_a.position_offset_steps: 12700
    control.station_b.position_offset_steps: 5200

/inspection/vision_node:
  ros__parameters:
    comm.node_heartbeat_period_ms: 500

/inspection/log_node:
  ros__parameters:
    comm.node_heartbeat_period_ms: 500
    log.database_path: "/var/lib/inspection/log/inspection.sqlite3"
    log.producer_spool_root: "/var/lib/inspection/spool"
    log.data_root: "/var/lib/inspection"
    log.retention_policy: "completed_image_count_10000"
    log.image_retention.max_completed_images: 10000
    log.report_root: "/var/lib/inspection/reports"
    log.timeout_tuning.auto_apply: false
    log.timeout_tuning.generated_path: "/var/lib/inspection/config/vision_timeout_tuning.json"
    log.timeout_tuning.minimum_samples: 10000
    log.timeout_tuning.safety_factor: 1.2

# TODO(HARDWARE_REQUIRED): TB6600/sensor/actuator와 위치 매핑은 Control 통합 시 확정합니다.
# 미확정 상태에서는 worker node 초기화가 INIT_BLOCKED 되어야 정상입니다.
# LED 제어 설정은 의도적으로 존재하지 않습니다(외부 controller 상시점등).
