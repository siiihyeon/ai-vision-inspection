/**:
  ros__parameters:
    profile: sim
    comm.master_heartbeat_timeout_ms: 2000

/inspection/master_node:
  ros__parameters:
    comm.master_heartbeat_period_ms: 500
    comm.node_heartbeat_timeout_ms: 2000
    system.expected_interface_version: "2.0.0"
    system.config_version: "dev-001"
    system.init_timeout_ms: 10000
    retry.init_interval_ms: 1000
    retry.warning_after_attempts: 3
    master.fifo.soft_limit: 18
    master.fifo.hard_capacity: 20
    master.sensor_ids.sensor_1: "SENSOR_1"
    master.sensor_ids.sensor_2: "SENSOR_2"
    master.sensor_ids.sensor_3: "SENSOR_3"
    master.sensor.accepted_edge: 1
    master.hardware_mapping_confirmed: true
    master.station_a.position_offset_steps: 0
    master.station_b.position_offset_steps: 0
    master.position_tolerance_steps: 0
    master.camera_ids.station_a: ["sim_station_a_camera_1", "sim_station_a_camera_2", "sim_station_a_camera_3"]
    master.camera_ids.station_b: ["sim_station_b_camera_1"]
    master.action.position_timeout_ms: 10000
    master.action.capture_timeout_ms: 30000
    master.action.actuation_timeout_ms: 10000
    master.action.conveyor_resume_timeout_ms: 10000
    master.pause_stop_timeout_ms: 10000
    master.shutdown_stop_timeout_ms: 10000
    master.log_spool_path: "/tmp/inspection/spool/master.sqlite3"
    master.log_flush_period_ms: 1000
    master.log_spool_warning_bytes: 0
    master.log_spool_hard_bytes: 0
    master.completed_context_retention_ms: 600000

/inspection/control_node:
  ros__parameters:
    comm.node_heartbeat_period_ms: 500

/inspection/vision_node:
  ros__parameters:
    comm.node_heartbeat_period_ms: 500
    vision.trigger.mode: "GIGE_ACTION_COMMAND"
    vision.camera_ids.station_a: ["sim_station_a_camera_1", "sim_station_a_camera_2", "sim_station_a_camera_3"]
    vision.camera_ids.station_b: ["sim_station_b_camera_1"]
    vision.camera_serials.station_a: ["", "", ""]
    vision.camera_serials.station_b: [""]
    vision.camera_ips.station_a: ["", "", ""]
    vision.camera_ips.station_b: [""]
    vision.camera_macs.station_a: ["", "", ""]
    vision.camera_macs.station_b: [""]
    vision.camera.width: 2448
    vision.camera.height: 2048
    vision.camera.sdk_buffer_count: 8
    vision.camera.frame_timeout_ms: 2000
    vision.camera.timestamp_tick_hz: 0
    vision.camera.ptp_enable_if_supported: true
    vision.camera.ptp_stability_ms: 0
    vision.camera.bayer_conversion_quality: 1
    vision.camera.expected_model_name: "MV-CS050-10GC"
    vision.camera.expected_firmware_version: "4.0.43"
    vision.mvs.python_module_path: ""
    vision.mvs.module_name: "MvCameraControl_class"
    vision.mvs.expected_sdk_version: "5.0.2"
    vision.mvs.expected_sdk_version_raw: 0
    vision.gige_action.device_key: 324478056
    vision.gige_action.station_a.group_key: 1
    vision.gige_action.station_b.group_key: 2
    vision.gige_action.group_mask: 4294967295
    vision.gige_action.broadcast_address: "255.255.255.255"
    vision.gige_action.ack_timeout_ms: 200
    vision.network.nic_ip: "192.168.10.10"
    vision.frame_arrival_skew_limit_us: 0  # 0=미확정/검사 비활성(sim 전용)
    vision.capture.max_attempts: 2
    vision.queue.capacity: 16             # sim 기본값; 생산값 아님
    vision.queue.warning_ratio: 0.75
    vision.queue.resume_ratio: 0.50
    vision.worker_count: 2                # 승인된 초기 worker 수
    vision.worker.serialize_model_access: true
    vision.inference_queue_total_timeout_ms: 0
    vision.data_root: "/tmp/inspection/data"
    vision.queue_journal_path: "/tmp/inspection/spool/vision_queue.sqlite3"
    vision.png_compression_level: 3
    vision.storage.warning_used_percent: 80.0
    vision.storage.pause_used_percent: 90.0
    vision.storage.critical_used_percent: 95.0
    vision.storage.warning_free_gb: 20
    vision.storage.pause_free_gb: 10
    vision.storage.critical_free_gb: 5
    vision.model.path: ""
    vision.model.sha256: ""
    vision.model.factory: ""
    vision.model.device: "cuda:0"
    vision.log.spool_path: "/tmp/inspection/spool/vision_log.sqlite3"
    vision.log.flush_period_ms: 1000
    vision.recovery.max_reconnect_attempts: 3
    vision.recovery.test_capture_count: 3

/inspection/log_node:
  ros__parameters:
    comm.node_heartbeat_period_ms: 500
    log.database_path: "/tmp/inspection/log/inspection.sqlite3"
    log.producer_spool_root: "/tmp/inspection/spool"
    log.data_root: "/tmp/inspection"
    log.retention_policy: "sim_keep_all"

# sim은 실제 Mega/TB6600/카메라/액추에이터에 출력하지 않습니다.
# Vision sim은 deterministic fake camera/model을 사용하며 생산 판정 성능을 나타내지 않습니다.
