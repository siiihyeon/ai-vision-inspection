/inspection/vision_node:
  ros__parameters:
    # 배포된 v3 robust bundle의 path/version/통합 directory SHA입니다.
    vision.model.path: "/opt/inspection/models/MB_v3_robust"
    vision.model.version: "MB_v3_robust"
    vision.model.sha256: "c99c4a012d4aef3cf95dbd785681de16987a5dab22d3d3a8357fd6fb53e18755"
    vision.model.runtime: "PYTORCH_PATCHCORE_ARTIFACT"
    vision.model.cuda_required: true
    vision.model.warmup_runs: 10
    vision.model.serialize_access: true  # GPU 시험 후에만 false 검토
    vision.worker_count: 1              # 초기값; GPU 시험 후 조정
    vision.image_load_worker_count: 3   # Station A PNG decode/전처리 병렬도
