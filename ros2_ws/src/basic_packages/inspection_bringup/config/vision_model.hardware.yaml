/inspection/vision_node:
  ros__parameters:
    # 이 경로에는 format_version=2인 4-view artifact bundle을 배포합니다.
    vision.model.path: "/opt/inspection/models/MB_resol_180_default"
    vision.model.version: "MB_resol_180_default"
    vision.model.sha256: ""  # TODO(ARTIFACT_REQUIRED): 최종 bundle 통합 SHA-256
    vision.model.runtime: "PYTORCH_PATCHCORE_ARTIFACT"
    vision.model.cuda_required: true
    vision.model.warmup_runs: 10
    vision.model.serialize_access: true  # GPU 시험 후에만 false 검토
    vision.worker_count: 1              # 초기값; GPU 시험 후 조정
