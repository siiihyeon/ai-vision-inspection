/inspection/vision_node:
  ros__parameters:
    vision.queue.capacity: 0                    # TODO(HARDWARE_REQUIRED): 유입/추론 실측식
    vision.inference_queue_total_timeout_ms: 0  # station별 값으로 이전하기 위한 fallback
    vision.inference.station_a.total_timeout_ms: 0  # TODO(HARDWARE_REQUIRED): p99.9
    vision.inference.station_b.total_timeout_ms: 0  # TODO(HARDWARE_REQUIRED): p99.9
    vision.result_spool_path: "/var/lib/inspection/spool/vision.sqlite3"
    vision.shutdown.queue_drain_timeout_ms: 3000
    vision.gpu.sample_interval_ms: 200
    vision.disk.warning_ratio: 0.90
    vision.disk.stop_ratio: 0.95
    vision.timeout_tuning.auto_apply: false
    vision.timeout_tuning.generated_path: "/var/lib/inspection/config/vision_timeout_tuning.json"
    vision.timeout_tuning.minimum_samples: 10000
    vision.timeout_tuning.safety_factor: 1.2
